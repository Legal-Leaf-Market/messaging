<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https://xppyedslhbrnqnymaaxb.supabase.co wss://xppyedslhbrnqnymaaxb.supabase.co https://0.peerjs.com wss://0.peerjs.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<title>Crossroads Private Line</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b35;--text:#e9ecf1;--muted:#8b93a3;--me:#3b6cf6;--them:#262b35;--accent:#3b6cf6;--danger:#e5484d;--ok:#30a46c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--line);color:var(--text)}
  button.primary{background:var(--accent)} button.danger{background:var(--danger)} button.ok{background:var(--ok)}
  button:disabled{opacity:.5;cursor:default}
  input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .hidden{display:none!important}
  /* login */
  #login{min-height:100%;display:grid;place-items:center;padding:16px}
  #login form{width:100%;max-width:340px;background:var(--panel);padding:24px;border-radius:16px;display:grid;gap:12px}
  #login h1{margin:0 0 4px;font-size:20px} .err{color:var(--danger);font-size:13px;min-height:1em}
  /* app */
  #app{display:grid;grid-template-columns:280px 1fr;height:100dvh}
  #side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #side header{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  #side header small{color:var(--muted);display:block}
  #contacts{overflow:auto;flex:1}
  .contact{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .contact.active{background:#1f2430} .contact .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  #chat{display:flex;flex-direction:column;min-height:0}
  #chat header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  #chat header .name{flex:1;font-weight:600}
  #back{display:none}
  #timeline{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
  .bubble{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--them);white-space:pre-wrap;word-wrap:break-word}
  .bubble.me{align-self:flex-end;background:var(--me)}
  .bubble .meta{font-size:11px;opacity:.65;margin-top:2px}
  .sys{align-self:center;color:var(--muted);font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px}
  #empty{margin:auto;color:var(--muted);text-align:center;padding:16px}
  #composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  /* call overlay */
  #callUI{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:10;padding:16px}
  #callBox{width:100%;max-width:720px;display:grid;gap:12px;text-align:center}
  #callBox video{width:100%;background:#000;border-radius:12px;max-height:60vh}
  #localVideo{position:fixed;right:16px;bottom:100px;width:120px!important;border-radius:10px}
  #callBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  @media (max-width:720px){
    #app{grid-template-columns:1fr}
    #app.in-chat #side{display:none} #app:not(.in-chat) #chat{display:none}
    #back{display:inline-block}
  }
</style>
</head>
<body>

<section id="login">
  <form id="loginForm">
    <h1>Private line</h1>
    <div style="color:var(--muted);font-size:13px">Messages and calls disappear after 24 hours.</div>
    <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none" required>
    <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="reset" class="hidden" style="min-height:100%;display:grid;place-items:center;padding:16px">
  <form id="resetForm" style="width:100%;max-width:340px;background:var(--panel);padding:24px;border-radius:16px;display:grid;gap:12px">
    <h1 style="margin:0 0 4px;font-size:20px">Set a new password</h1>
    <input id="np1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required>
    <input id="np2" type="password" placeholder="Type it again" autocomplete="new-password" minlength="8" required>
    <button class="primary" type="submit">Save password</button>
    <button type="button" id="resetCancel">Cancel</button>
    <div class="err" id="resetErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <aside id="side">
    <header>
      <div><strong id="meName"></strong><small>Your line</small></div>
      <div style="display:flex;gap:6px"><button id="pwBtn" title="Change password">Password</button><button id="logout">Sign out</button></div>
    </header>
    <div id="contacts"></div>
  </aside>
  <main id="chat">
    <header>
      <button id="back">&larr;</button>
      <span class="name" id="chatName">Pick a line</span>
      <button id="callBtn" disabled>Call</button>
      <button id="videoBtn" disabled>Video</button>
      <button id="clearBtn" class="danger" disabled title="Delete this conversation for both of you now">Self-destruct</button>
    </header>
    <div id="timeline"><div id="empty">Choose someone on the left to start.</div></div>
    <form id="composer">
      <input id="msg" placeholder="Message (disappears in 24h)" autocomplete="off" disabled>
      <button class="primary" id="sendBtn" disabled>Send</button>
    </form>
  </main>
</section>

<div id="callUI" class="hidden">
  <div id="callBox">
    <div id="callTitle" style="font-size:20px;font-weight:600"></div>
    <div id="callStatus" style="color:var(--muted)"></div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="callBtns">
      <button class="ok" id="answerBtn">Answer</button>
      <button class="danger" id="declineBtn">Decline</button>
      <button id="muteBtn">Mute</button>
      <button id="camBtn">Camera off</button>
      <button class="danger" id="hangBtn">End call</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.min.js"></script>
<script src="peerjs.min.js"></script>
<script>
/* ===== SETTINGS — Supabase project URL + publishable key (safe to be public) ===== */
const SUPABASE_URL      = 'https://xppyedslhbrnqnymaaxb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_m_BQ-HC1v3-JANssdXJRlA_9TphYPCM';
const LOGIN_DOMAIN      = 'crossroadsweddingco.shop'; // users are created as username@this-domain (full email also works)
/* ================================================================== */

const DAY = 24 * 60 * 60 * 1000;
const PEER_PREFIX = 'crwco-line-';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let me = null;            // my profile
let lines = {};           // id -> profile
let activeId = null;      // who I'm chatting with
let msgs = [];            // messages for active chat
let calls = [];           // calls for active chat
let unread = new Set();
let peer = null;
let cur = null;           // current call {id, role, kind, peerCall, local, timer}
let pendingIncoming = null;

/* ---------- auth ---------- */
$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('loginErr').textContent = '';
  const u = $('u').value.trim().toLowerCase();
  const email = u.includes('@') ? u : u + '@' + LOGIN_DOMAIN;
  const { error } = await sb.auth.signInWithPassword({ email, password: $('p').value });
  if (error) $('loginErr').textContent = 'Wrong username or password.';
};

/* ---------- password reset / change ---------- */
let recovering = /type=recovery/.test(location.hash); // opened from a reset email
function showReset() {
  $('login').classList.add('hidden'); $('app').classList.add('hidden');
  $('reset').classList.remove('hidden'); $('resetErr').textContent = ''; $('np1').focus();
}
$('pwBtn').onclick = showReset;
$('resetCancel').onclick = () => {
  $('reset').classList.add('hidden');
  if (me) $('app').classList.remove('hidden'); else $('login').classList.remove('hidden');
};
$('resetForm').onsubmit = async e => {
  e.preventDefault();
  if ($('np1').value !== $('np2').value) { $('resetErr').textContent = "Passwords don't match."; return; }
  const { error } = await sb.auth.updateUser({ password: $('np1').value });
  if (error) { $('resetErr').textContent = error.message; return; }
  $('np1').value = $('np2').value = ''; recovering = false;
  history.replaceState(null, '', location.pathname);
  $('reset').classList.add('hidden');
  const { data } = await sb.auth.getSession();
  if (me) $('app').classList.remove('hidden'); else if (data.session) start(data.session.user.id);
};
$('logout').onclick = async () => { destroyPeer(); await sb.auth.signOut(); location.reload(); };

sb.auth.onAuthStateChange((evt, session) => {
  // setTimeout: never call Supabase from inside this callback (it can hang the client)
  setTimeout(() => {
    if (evt === 'PASSWORD_RECOVERY') { recovering = true; showReset(); return; }
    if (recovering) return;
    if (session && !me) start(session.user.id);
    if (!session) { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); }
  }, 0);
});

async function start(uid) {
  const { data, error } = await sb.from('profiles').select('*').order('display_name');
  if (error) { alert('Could not load lines: ' + error.message); return; }
  data.forEach(p => lines[p.id] = p);
  me = lines[uid];
  if (!me) { alert('This login has no line yet. Re-run setup.sql.'); return; }
  $('meName').textContent = me.display_name;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  renderContacts(); subscribe(); startPeer();
  setInterval(prune, 30000);
}

/* ---------- contacts ---------- */
function renderContacts() {
  const box = $('contacts'); box.innerHTML = '';
  Object.values(lines).filter(p => p.id !== me.id).forEach(p => {
    const el = document.createElement('div');
    el.className = 'contact' + (p.id === activeId ? ' active' : '');
    const n = document.createElement('span'); n.textContent = p.display_name; el.append(n);
    if (unread.has(p.id)) { const d = document.createElement('span'); d.className = 'dot'; el.append(d); }
    el.onclick = () => openChat(p.id);
    box.append(el);
  });
  if (box.children.length === 0) box.innerHTML = '<div id="empty">No other lines yet.</div>';
}

async function openChat(id) {
  activeId = id; unread.delete(id);
  $('app').classList.add('in-chat');
  $('chatName').textContent = lines[id].display_name;
  ['callBtn','videoBtn','clearBtn','msg','sendBtn'].forEach(b => $(b).disabled = false);
  renderContacts();
  const pair = `and(sender.eq.${me.id},recipient.eq.${id}),and(sender.eq.${id},recipient.eq.${me.id})`;
  const cpair = `and(caller.eq.${me.id},callee.eq.${id}),and(caller.eq.${id},callee.eq.${me.id})`;
  const [m, c] = await Promise.all([
    sb.from('messages').select('*').or(pair).order('created_at'),
    sb.from('calls').select('*').or(cpair).order('started_at'),
  ]);
  if (activeId !== id) return;
  msgs = m.data || []; calls = c.data || [];
  render(true);
  $('msg').focus();
}
$('back').onclick = () => { $('app').classList.remove('in-chat'); activeId = null; renderContacts(); };

/* ---------- timeline ---------- */
function left(ts) {
  const ms = new Date(ts).getTime() + DAY - Date.now();
  if (ms <= 0) return 'gone';
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  return h ? `${h}h left` : `${m}m left`;
}
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

function callText(c) {
  const kind = c.kind === 'video' ? 'Video call' : 'Voice call';
  const out = c.caller === me.id;
  if (c.status === 'ringing') return `${kind} ringing…`;
  if (c.status === 'missed') return out ? `${kind} — no answer` : `Missed ${kind.toLowerCase()}`;
  if (c.status === 'declined') return `${kind} declined`;
  if (c.answered_at && c.ended_at) {
    const s = Math.round((new Date(c.ended_at) - new Date(c.answered_at)) / 1000);
    return `${kind} · ${Math.floor(s / 60)}m ${s % 60}s`;
  }
  return kind;
}

function render(scroll) {
  const tl = $('timeline');
  const atBottom = tl.scrollHeight - tl.scrollTop - tl.clientHeight < 80;
  tl.innerHTML = '';
  const items = [
    ...msgs.map(x => ({ t: x.created_at, m: x })),
    ...calls.map(x => ({ t: x.started_at, c: x })),
  ].filter(i => Date.now() - new Date(i.t) < DAY).sort((a, b) => new Date(a.t) - new Date(b.t));
  if (!items.length) { tl.innerHTML = '<div id="empty">Nothing here. Everything is wiped 24 hours after it’s sent.</div>'; return; }
  for (const i of items) {
    const el = document.createElement('div');
    if (i.m) {
      el.className = 'bubble' + (i.m.sender === me.id ? ' me' : '');
      el.textContent = i.m.body;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = `${clock(i.t)} · ${left(i.t)}`; el.append(meta);
    } else {
      el.className = 'sys'; el.textContent = `${callText(i.c)} · ${clock(i.t)}`;
    }
    tl.append(el);
  }
  if (scroll || atBottom) tl.scrollTop = tl.scrollHeight;
}

function prune() {
  const before = msgs.length + calls.length;
  msgs = msgs.filter(x => Date.now() - new Date(x.created_at) < DAY);
  calls = calls.filter(x => Date.now() - new Date(x.started_at) < DAY);
  if (activeId) render(false);
  return before !== msgs.length + calls.length;
}

/* ---------- sending ---------- */
$('composer').onsubmit = async e => {
  e.preventDefault();
  const body = $('msg').value.trim(); if (!body || !activeId) return;
  $('msg').value = '';
  const { data, error } = await sb.from('messages').insert({ recipient: activeId, body }).select().single();
  if (error) { alert('Not sent: ' + error.message); $('msg').value = body; return; }
  if (!msgs.some(x => x.id === data.id)) { msgs.push(data); render(true); }
};

$('clearBtn').onclick = async () => {
  if (!activeId || !confirm(`Delete this whole conversation with ${lines[activeId].display_name} for both of you, right now?`)) return;
  const pair = `and(sender.eq.${me.id},recipient.eq.${activeId}),and(sender.eq.${activeId},recipient.eq.${me.id})`;
  const cpair = `and(caller.eq.${me.id},callee.eq.${activeId}),and(caller.eq.${activeId},callee.eq.${me.id})`;
  await Promise.all([sb.from('messages').delete().or(pair), sb.from('calls').delete().or(cpair)]);
  msgs = []; calls = []; render(true);
};

/* ---------- realtime ---------- */
function subscribe() {
  sb.channel('inbox')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, ({ new: m }) => {
      const other = m.sender === me.id ? m.recipient : m.sender;
      if (other === activeId) { if (!msgs.some(x => x.id === m.id)) { msgs.push(m); render(false); } }
      else if (m.sender !== me.id) { unread.add(other); renderContacts(); }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, ({ old }) => {
      msgs = msgs.filter(x => x.id !== old.id); if (activeId) render(false);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'calls' }, ({ eventType, new: c, old }) => {
      if (eventType === 'DELETE') { calls = calls.filter(x => x.id !== old.id); if (activeId) render(false); return; }
      const other = c.caller === me.id ? c.callee : c.caller;
      if (other === activeId) {
        const i = calls.findIndex(x => x.id === c.id);
        i >= 0 ? calls[i] = c : calls.push(c); render(false);
      } else if (c.callee === me.id && c.status === 'missed') { unread.add(other); renderContacts(); }
      if (cur && cur.id === c.id) {
        if (['declined', 'ended', 'missed'].includes(c.status)) endLocal(c.status === 'declined' ? 'Declined' : 'Call ended');
        if (c.status === 'answered' && cur.role === 'caller') $('callStatus').textContent = 'Connected';
      }
    })
    .subscribe();
}

/* ---------- calls (peer-to-peer, each line has a fixed address) ---------- */
function startPeer() {
  peer = new Peer(PEER_PREFIX + me.id);
  peer.on('call', incoming);
  peer.on('error', err => {
    if (err.type === 'peer-unavailable' && cur && cur.role === 'caller') {
      setCallStatus('missed'); endLocal(`${lines[cur.other].display_name} is offline — logged as a missed call`);
    } else if (err.type === 'unavailable-id') {
      // Same line open in another tab/device; calls ring there instead.
      console.warn('Line already open elsewhere');
    } else console.warn('peer', err.type);
  });
  peer.on('disconnected', () => setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 2000));
}
function destroyPeer() { try { peer && peer.destroy(); } catch {} peer = null; }

async function media(kind) {
  return navigator.mediaDevices.getUserMedia({ audio: true, video: kind === 'video' });
}
function showCall(title, status, mode) {
  $('callUI').classList.remove('hidden');
  $('callTitle').textContent = title; $('callStatus').textContent = status;
  const ringing = mode === 'incoming';
  $('answerBtn').classList.toggle('hidden', !ringing);
  $('declineBtn').classList.toggle('hidden', !ringing);
  ['muteBtn', 'camBtn', 'hangBtn'].forEach(b => $(b).classList.toggle('hidden', ringing));
  $('camBtn').classList.toggle('hidden', ringing || cur?.kind !== 'video');
}
function attachRemote(stream) {
  $('remoteVideo').srcObject = stream; // audio still plays when the video box is hidden
  $('remoteVideo').classList.toggle('hidden', cur?.kind !== 'video');
}
async function setCallStatus(status) {
  if (!cur) return;
  const patch = { status };
  if (status === 'answered') patch.answered_at = new Date().toISOString();
  if (['ended', 'missed', 'declined'].includes(status)) patch.ended_at = new Date().toISOString();
  await sb.from('calls').update(patch).eq('id', cur.id);
}

async function placeCall(kind) {
  if (!activeId || cur) return;
  let local;
  try { local = await media(kind); } catch { alert('Allow microphone' + (kind === 'video' ? '/camera' : '') + ' access to call.'); return; }
  const { data, error } = await sb.from('calls').insert({ callee: activeId, kind }).select().single();
  if (error) { local.getTracks().forEach(t => t.stop()); alert(error.message); return; }
  cur = { id: data.id, role: 'caller', kind, local, other: activeId };
  $('localVideo').srcObject = local; $('localVideo').classList.toggle('hidden', kind !== 'video');
  showCall(lines[activeId].display_name, 'Calling…', 'active');
  cur.peerCall = peer.call(PEER_PREFIX + activeId, local, { metadata: { callId: data.id, kind } });
  cur.peerCall?.on('stream', s => { attachRemote(s); $('callStatus').textContent = 'Connected'; clearTimeout(cur?.timer); });
  cur.timer = setTimeout(async () => {
    const { data: row } = await sb.from('calls').select('status').eq('id', data.id).single();
    if (cur && cur.id === data.id && row?.status === 'ringing') { await setCallStatus('missed'); endLocal('No answer'); }
  }, 35000);
}
$('callBtn').onclick = () => placeCall('audio');
$('videoBtn').onclick = () => placeCall('video');

async function incoming(pc) {
  const { callId, kind } = pc.metadata || {};
  const from = pc.peer.replace(PEER_PREFIX, '');
  if (cur || !lines[from]) { pc.close(); return; }
  // Only ring if the call is really logged from that line to me (blocks spoofed callers)
  const { data: row } = await sb.from('calls').select('caller,callee,status').eq('id', callId).maybeSingle();
  if (!row || row.caller !== from || row.callee !== me.id || row.status !== 'ringing' || cur) { pc.close(); return; }
  cur = { id: callId, role: 'callee', kind: kind || 'audio', peerCall: pc, other: from };
  showCall(lines[from].display_name, `Incoming ${kind === 'video' ? 'video' : 'voice'} call`, 'incoming');
  pc.on('stream', attachRemote);
}
$('answerBtn').onclick = async () => {
  if (!cur) return;
  try { cur.local = await media(cur.kind); } catch { alert('Allow microphone/camera access to answer.'); return; }
  $('localVideo').srcObject = cur.local; $('localVideo').classList.toggle('hidden', cur.kind !== 'video');
  cur.peerCall.answer(cur.local);
  await setCallStatus('answered');
  showCall(lines[cur.other].display_name, 'Connected', 'active');
};
$('declineBtn').onclick = async () => { await setCallStatus('declined'); endLocal(); };
$('hangBtn').onclick = async () => {
  if (!cur) return;
  const { data } = await sb.from('calls').select('status').eq('id', cur.id).single();
  await setCallStatus(data?.status === 'answered' ? 'ended' : 'missed');
  endLocal();
};
$('muteBtn').onclick = () => {
  const t = cur?.local?.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $('muteBtn').textContent = t.enabled ? 'Mute' : 'Unmute';
};
$('camBtn').onclick = () => {
  const t = cur?.local?.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $('camBtn').textContent = t.enabled ? 'Camera off' : 'Camera on';
};

function endLocal(note) {
  if (!cur) return;
  clearTimeout(cur.timer);
  try { cur.peerCall?.close(); } catch {}
  cur.local?.getTracks().forEach(t => t.stop());
  $('remoteVideo').srcObject = null; $('localVideo').srcObject = null;
  $('muteBtn').textContent = 'Mute'; $('camBtn').textContent = 'Camera off';
  cur = null;
  if (note) { $('callStatus').textContent = note; setTimeout(() => !cur && $('callUI').classList.add('hidden'), 1800); }
  else $('callUI').classList.add('hidden');
}
window.addEventListener('beforeunload', () => {
  if (cur) setCallStatus(cur.role === 'callee' && !cur.local ? 'declined' : 'ended'); // best effort
  destroyPeer();
});
</script>
</body>
</html>
